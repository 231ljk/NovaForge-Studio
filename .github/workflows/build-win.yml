name: Build Windows (Flash + Studio)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RAYON_NUM_THREADS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local AI runtime
        run: |
          # llama-server.exe 不再入库（5.4MB 二进制），构建时从 Release 拉取
          New-Item -ItemType Directory -Force -Path build/mimo/llama-server | Out-Null
          Invoke-WebRequest -Uri "https://github.com/231ljk/NovaForge-Studio/releases/download/v0.1.0/llama-server-win-x64.exe" -OutFile "build/mimo/llama-server/llama-server.exe"
          Get-Item build/mimo/llama-server/llama-server.exe | Select-Object Name, Length

      - name: Build NovaForge Flash installer
        run: npm run pack:flash:win
        timeout-minutes: 25

      - name: Build NovaForge Studio installer
        run: npm run pack:studio:win
        timeout-minutes: 25

      - name: List outputs
        run: |
          Get-ChildItem C:\nfbuild\release -Recurse -Filter *.exe | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            C:/nfbuild/release/flash/*.exe
            C:/nfbuild/release/flash/*.blockmap
            C:/nfbuild/release/studio/*.exe
            C:/nfbuild/release/studio/*.blockmap
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "NovaForge ${{ github.ref_name }}" --notes "NovaForge Flash / Studio 桌面安装包" || echo "release already exists"
          gh release upload "${{ github.ref_name }}" C:/nfbuild/release/flash/*.exe C:/nfbuild/release/studio/*.exe --clobber
