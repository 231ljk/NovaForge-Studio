name: Build iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      # 付费 Apple Developer Program 账号才能提供这些签名材料
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.novaforge.studio' }}
      DEVELOPMENT_CERT_BASE64: ${{ secrets.DEVELOPMENT_CERT_BASE64 || '' }}
      DEVELOPMENT_CERT_PASSWORD: ${{ secrets.DEVELOPMENT_CERT_PASSWORD || '' }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check signing configuration
        id: signing
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$DEVELOPMENT_CERT_BASE64" ] && \
             [ -n "$DEVELOPMENT_CERT_PASSWORD" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::签名 Secrets 不完整，只构建 unsigned xcarchive，不发布 IPA"
          fi

      - name: Import signing cert + provisioning profile
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          echo "$DEVELOPMENT_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" \
            -P "$DEVELOPMENT_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Sync web assets to iOS project
        run: npx cap sync ios

      - name: Build iOS archive
        run: |
          set -o pipefail
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              archive 2>&1 | tail -30
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              archive 2>&1 | tail -30
          fi
        timeout-minutes: 20

      - name: Export signed IPA
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          set -o pipefail
          cat > /tmp/exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          PLIST

          xcodebuild \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -allowProvisioningUpdates \
            export 2>&1 | tail -20

          IPA_PATH=$(find build -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "未生成 IPA" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          mv "$IPA_PATH" "build/NovaForge-Studio-${VERSION}-ios.ipa"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            build/*.ipa
            build/App.xcarchive
          if-no-files-found: error

      - name: Publish signed IPA to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "NovaForge ${{ github.ref_name }}" --notes "NovaForge 全平台发布" || true
          gh release upload "${{ github.ref_name }}" build/*.ipa --clobber
