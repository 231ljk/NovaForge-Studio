name: Build iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      # 付费 Apple Developer Program 账号才能有这些：
      # DEVELOPMENT_CERT_BASE64 + DEVELOPMENT_CERT_PASSWORD → .p12 开发证书
      # PROVISIONING_PROFILE_BASE64                         → .mobileprovision
      # APPLE_TEAM_ID                                       → 团队 ID（10 位字母）
      # APPLE_BUNDLE_ID                                     → com.novaforge.studio（或你自己的）
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.novaforge.studio' }}
      DEVELOPMENT_CERT_BASE64: ${{ secrets.DEVELOPMENT_CERT_BASE64 || '' }}
      DEVELOPMENT_CERT_PASSWORD: ${{ secrets.DEVELOPMENT_CERT_PASSWORD || '' }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # —— 签名部分（付费账号才配）——
      - name: Import signing cert + provisioning profile (if provided)
        if: ${{ env.DEVELOPMENT_CERT_BASE64 != '' }}
        run: |
          # 导入 .p12 到临时钥匙串
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          echo "$DEVELOPMENT_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" \
            -P "$DEVELOPMENT_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$DEVELOPMENT_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Sync web assets to iOS project
        run: npx cap sync ios

      - name: Build iOS archive
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "⚠️  无 Apple Team ID（付费开发者账号的 Team ID），走 unsigned archive"
            echo "  → 要出 .ipa 需要在 GitHub Secrets 配 APPLE_TEAM_ID、DEVELOPMENT_CERT_BASE64、DEVELOPMENT_CERT_PASSWORD、PROVISIONING_PROFILE_BASE64"
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              archive \
              2>&1 | tail -30
          else
            # 有签名 → 自动匹配证书 + provisioning profile
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              archive \
              2>&1 | tail -30
          fi
        timeout-minutes: 15

      - name: Export .ipa (if signed)
        if: ${{ env.APPLE_TEAM_ID != '' }}
        run: |
          cat > /tmp/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          PLIST
          sed -i "s/\$APPLE_TEAM_ID/$APPLE_TEAM_ID/" /tmp/exportOptions.plist

          xcodebuild \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -allowProvisioningUpdates \
            export \
            2>&1 | tail -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            build/*.ipa
            build/App.xcarchive
          if-no-files-found: warn
