<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>NovaForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b6cf6'/%3E%3Ctext x='32' y='43' font-family='-apple-system,Segoe UI,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3ENF%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app">

  <!-- ===================== 登录页 ===================== -->
  <section class="view view-login" id="view-login">
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <span class="brand-badge">NF</span>
          <div class="brand-name">NovaForge</div>
        </div>

        <div class="field-group">
          <input class="auth-field" id="login-email" type="email" placeholder="邮箱地址" autocomplete="username" autocapitalize="off" spellcheck="false" />
          <div class="code-row">
            <input class="auth-field" id="login-code" inputmode="numeric" placeholder="验证码" autocomplete="one-time-code" />
            <button class="code-btn" id="btn-request-code" type="button">获取验证码</button>
          </div>
          <button class="primary-button" id="btn-mail-login" type="button">登录</button>
        </div>

        <label class="agree-row" for="login-agree">
          <input class="agree-check" id="login-agree" type="checkbox" />
          <span class="agree-text">已阅读并同意 <span class="agree-link" data-doc="privacy">《隐私政策》</span>与<span class="agree-link" data-doc="terms">《用户协议》</span></span>
        </label>

        <div class="provider-block">
          <div class="provider-title">更多登录方式</div>
          <div class="provider-row">
            <button class="provider" id="btn-github" type="button" aria-label="GitHub 登录">
              <span class="provider-icon provider-icon-github">
                <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
              </span>
              <span class="provider-name">GitHub</span>
            </button>
            <button class="provider" id="btn-gitee" type="button" aria-label="Gitee 登录">
              <span class="provider-icon provider-icon-gitee">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path fill="#fff" d="M14.7 7.2H8.1c-.7 0-1.3.6-1.3 1.3v7.1c0 .7.6 1.3 1.3 1.3h5.6c.7 0 1.3-.6 1.3-1.3v-2.3h-4.2v-1.9h5.7c.7 0 1.3-.6 1.3-1.3V8.5c0-.7-.6-1.3-1.3-1.3z"/></svg>
              </span>
              <span class="provider-name">Gitee</span>
            </button>
            <button class="provider provider-soon" id="btn-weibo" type="button" aria-label="微博登录">
              <span class="provider-icon provider-icon-weibo">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path fill="#fff" d="M10.6 17.4c-3 0-5.4-1.3-5.4-3 0-1 .7-2.2 1.9-3.2 1.6-1.3 3.4-1.9 4.5-1.3.5.3.4 1 .2 1.6 0 .1.1.2.2.1.9-.4 1.7-.4 2 .3.2.4.1.9-.1 1.4.8.3 1.3.9 1.3 1.6 0 1.4-2 2.5-4.6 2.5zm-.5-4.6c-1.5.2-2.6 1.2-2.5 2.3.1 1 1.4 1.7 2.9 1.5 1.5-.2 2.6-1.2 2.5-2.3-.1-1-1.4-1.7-2.9-1.5z"/><circle cx="17.5" cy="8.5" r="2.5" fill="#fff"/></svg>
              </span>
              <span class="provider-name">微博</span>
            </button>
          </div>
        </div>

        <div class="status" id="login-status" hidden></div>

        <div class="demo-link" id="btn-demo">跳过登录，先看演示</div>
      </div>
    </div>
  </section>

  <!-- 授权浮层（居中） -->
  <div class="oauth-mask" id="oauth-mask" hidden>
    <div class="oauth-card">
      <div class="oauth-card-title" id="oauth-title">授权码</div>
      <div class="oauth-card-code" id="oauth-code"></div>
      <div class="oauth-card-actions">
        <button class="mini-button" id="btn-copy-code" type="button">复制验证码</button>
        <button class="mini-button mini-button-ghost" id="btn-open-verify" type="button">打开授权链接</button>
      </div>
      <div class="link-button" id="btn-cancel-oauth">取消</div>
    </div>
  </div>

  <!-- 隐私政策 / 用户协议浮层 -->
  <div class="oauth-mask" id="agreement-mask" hidden>
    <div class="oauth-card agreement-card">
      <div class="oauth-card-title" id="agreement-title">隐私政策</div>
      <div class="agreement-body" id="agreement-body"></div>
      <div class="oauth-card-actions">
        <button class="mini-button" id="btn-agree-accept" type="button">同意并勾选</button>
        <button class="mini-button mini-button-ghost" id="btn-agree-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===================== 主应用 ===================== -->
  <section class="view view-app" id="view-app" hidden>
    <header class="topbar" id="topbar">
      <div class="nav-back" id="nav-back" hidden>‹</div>
      <h1 class="nav-title" id="nav-title">设备</h1>
      <div class="nav-right" id="nav-right"></div>
    </header>

    <main class="page-host" id="page-host"></main>

    <nav class="tabbar" id="tabbar">
      <div class="tab-item tab-item-active" data-tab="home"><span class="tab-text">设备</span></div>
      <div class="tab-item" data-tab="scenes"><span class="tab-text">场景</span></div>
      <div class="tab-item" data-tab="ai"><span class="tab-text">AI 助手</span></div>
      <div class="tab-item" data-tab="me"><span class="tab-text">我的</span></div>
    </nav>
  </section>

  <!-- ===================== 浮层 ===================== -->
  <div class="toast" id="toast"></div>

  <div class="loading-mask" id="loading" hidden>
    <div class="loading-box">
      <div class="loading-ring"></div>
      <span class="loading-text" id="loading-text">正在处理</span>
    </div>
  </div>

  <div class="sheet-mask" id="sheet-mask" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="dialog-mask" id="dialog-mask" hidden>
    <div class="dialog" id="dialog">
      <div class="dialog-title" id="dialog-title"></div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-actions">
        <div class="dialog-btn" id="dialog-cancel">取消</div>
        <div class="dialog-btn dialog-btn-danger" id="dialog-ok">确定</div>
      </div>
    </div>
  </div>

</div>

<script src="local-ai.js"></script>
<script src="data/demo.js"></script>
<script src="services/util.js"></script>
<script src="services/permissions.js"></script>
<script src="services/account.js"></script>
<script src="services/ha.js"></script>
<script src="services/store.js"></script>
<script src="services/theme.js"></script>
<script src="pages/home.js"></script>
<script src="pages/scenes.js"></script>
<script src="pages/ai.js"></script>
<script src="pages/me.js"></script>
<script src="pages/login.js"></script>
<script src="pages/add-device.js"></script>
<script src="app.js"></script>
</body>
</html>
